<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeclineCraft Annotation</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efeee9; --ink:#1d1d1b; --ink-2:#55544f; --ink-3:#86857e;
  --line:#dddbd3; --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e3efe8; --mark:#fbe7a1;
  --warn:#8a4b0f; --warn-soft:#fbeedd; --err:#a12d2d; --err-soft:#f8e2e2; --ok:#2f6b4f;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --surface:#1f1f1c; --surface-2:#292925; --ink:#ecebe6; --ink-2:#b4b3ab; --ink-3:#85847c;
    --line:#383833; --accent:#6fbf96; --accent-ink:#0e1a14; --accent-soft:#1f3329; --mark:#5b4d17;
    --warn:#e8b178; --warn-soft:#3a2a17; --err:#ee8f8f; --err-soft:#3d1f1f; --ok:#6fbf96;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --surface:#1f1f1c; --surface-2:#292925; --ink:#ecebe6; --ink-2:#b4b3ab; --ink-3:#85847c;
  --line:#383833; --accent:#6fbf96; --accent-ink:#0e1a14; --accent-soft:#1f3329; --mark:#5b4d17;
  --warn:#e8b178; --warn-soft:#3a2a17; --err:#ee8f8f; --err-soft:#3d1f1f; --ok:#6fbf96;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
@media (max-width:700px){header{position:static}.bar{gap:8px 16px}}
.brand{font-weight:650;letter-spacing:-.01em}
.brand small{display:block;font-weight:450;color:var(--ink-3);font-size:12px;letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav button:not([aria-selected="true"]):hover{background:var(--surface-2)}
.save{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.save.err{color:var(--err)}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:var(--radius);background:var(--warn-soft);color:var(--warn);font-size:14px}
.banner.err{background:var(--err-soft);color:var(--err)}
main{padding:18px 0 64px}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.meter{flex:1;min-width:140px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.progress .txt{font-size:13px;color:var(--ink-2);white-space:nowrap}
.grid{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 18px}
.grid button{width:14px;height:14px;padding:0;border-radius:3px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.grid button.done{background:var(--accent);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.content{padding:18px 20px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 6px}
.question{font-size:17px;line-height:1.5;margin:0 0 4px;font-weight:550}
.answer{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14.5px}
.passage{border-top:1px solid var(--line);padding:14px 0 4px}
.passage h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.passage p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:var(--ink)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.ref{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--accent-soft)}
.ref .answer{font-size:14px}
.form{padding:16px 18px;position:sticky;top:76px}
@media (max-width:900px){.form{position:static}}
fieldset{border:0;margin:0 0 16px;padding:0}
legend{font-weight:600;font-size:14px;margin-bottom:4px;padding:0}
.hint{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin:3px 0 0;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt span small{display:block;color:var(--ink-3);font-size:12px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;resize:vertical;font-size:14px}
textarea:focus,button:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.navrow{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--ink-3)}
.status{font-size:12.5px;margin:10px 0 0}
.status.done{color:var(--ok)}
.prose{max-width:760px}
.prose h2{font-size:20px;margin:6px 0 10px;letter-spacing:-.01em}
.prose h3{font-size:16px;margin:22px 0 6px}
.prose p,.prose li{color:var(--ink);font-size:15px}
.prose ul{padding-left:20px}
.prose dt{font-weight:600;margin-top:10px}
.prose dd{margin:2px 0 0 0;color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:13px}
td.num{font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">DeclineCraft annotation<small id="who">Loading…</small></div>
    <nav id="tabs" role="tablist"></nav>
    <div class="save" id="save" aria-live="polite"></div>
  </div>
</header>
<div class="wrap" id="banners"></div>
<main class="wrap" id="main"></main>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };

  // ---------- state ----------
  const S = { ready: false, items: [], byId: {}, labels: {}, order: { R: [], C: [] }, idx: { R: 0, C: 0 },
              tab: store.get("dc-tab") || "guide", annotator: "" };

  // ---------- completeness ----------
  function complete(item, l){
    if (!l) return false;
    return item.task === "R" ? !!l.b_response : !!l.b_correct;
  }
  const doneCount = t => S.order[t].filter(id => complete(S.byId[id], S.labels[id])).length;

  // ---------- saving ----------
  // Each change is queued as a field-level patch for its item and kept (in memory and in this
  // browser's storage) until annotate.py confirms it is in the CSV. A failed save is retried, never
  // dropped. Only changed fields are sent, so a second tab cannot blank fields it never touched.
  const pend = {};          // itemId -> {field: value} not yet confirmed
  const sending = {};       // itemId -> true while its request is in flight
  const timers = {};
  let lastErr = "", retryTimer = null, editSeq = 0;
  const unsaved = () => Object.keys(pend).length;
  const pendKey = () => `dc-pending-${S.annotator}`;
  function setSave(){
    const el = $("#save");
    if (!S.ready){ el.textContent = ""; return; }
    const n = unsaved();
    if (lastErr){ el.textContent = `Unsaved answers on ${n} item${n === 1 ? "" : "s"} — retrying`; el.className = "save err"; return; }
    el.textContent = n ? "Saving…" : "All changes saved to the CSV"; el.className = "save";
  }
  function showError(msg){
    lastErr = msg;
    $("#banners").innerHTML = msg ? `<div class="banner err">${esc(msg)}</div>` : "";
    setSave();
  }
  function edit(id, field, value){
    editSeq++;
    const l = { ...(S.labels[id] || {}) };
    if (value === "") delete l[field]; else l[field] = value;
    S.labels[id] = l;
    (pend[id] = pend[id] || {})[field] = value;
    store.set(pendKey(), JSON.stringify(pend));
  }
  async function flush(id){
    clearTimeout(timers[id]); delete timers[id];
    if (sending[id] || !pend[id]) return;
    const patch = { ...pend[id] }, hadErr = !!lastErr;
    sending[id] = true; setSave();
    let ok = false;
    try {
      const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ id, changes: patch }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || `The annotation program answered ${r.status}.`);
      for (const k in patch) if (pend[id] && pend[id][k] === patch[k]) delete pend[id][k];   // a newer edit stays queued
      if (pend[id] && !Object.keys(pend[id]).length) delete pend[id];
      store.set(pendKey(), JSON.stringify(pend));
      ok = true;
    } catch (e) {
      showError(e instanceof TypeError
        ? "Can’t reach the annotation program. Start it again with “python annotate.py”. Your recent answers are kept and will be saved automatically once it is running."
        : e.message);
      if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; flushAll(); }, 3000);
    } finally { sending[id] = false; }
    if (ok){
      if (hadErr) showError("");
      if (pend[id]) flush(id);
      else if (hadErr) flushAll();
    }
    setSave();
  }
  const flushAll = () => Object.keys(pend).forEach(flush);
  function flushLater(id, delay){ clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), delay); }
  window.addEventListener("beforeunload", e => { if (unsaved()){ e.preventDefault(); e.returnValue = ""; } });

  // When this tab comes back into view, pick up anything saved from another tab -- but only when
  // nothing here is waiting to be saved, and nothing was edited while the refresh was in flight.
  async function refresh(){
    if (!S.ready || unsaved()) return;
    const seq = editSeq;
    try {
      const d = await (await fetch("/api/items", { cache: "no-store" })).json();
      if (seq !== editSeq || unsaved()) return;
      let changed = false;
      for (const i of d.items) if (JSON.stringify(i.labels) !== JSON.stringify(S.labels[i.id] || {})){ S.labels[i.id] = i.labels; changed = true; }
      if (changed) render();
    } catch {}
  }
  window.addEventListener("focus", refresh);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  // ---------- rendering helpers ----------
  const STOP = new Set("about above after again against also because been before being below between both cannot could does doing down during each even from have having here into just more most much need only other over same should some such than that their them then there these they this those through under until very want what when where which while will with would your yours make made like able know does doesn give using used take does were quot minecraft player game".split(" "));
  function terms(q){
    return [...new Set((q.toLowerCase().match(/[a-z][a-z0-9]{3,}/g) || []).filter(w => !STOP.has(w)))]
      .map(w => w.length > 5 ? w.replace(/(es|s|ed|ing)$/, "") : w).filter(w => w.length >= 4);
  }
  function highlight(text, ts){
    const safe = esc(text);
    if (!ts.length) return safe;
    const re = new RegExp(`\\b(${ts.map(t => t.replace(/[^a-z0-9]/g, "")).join("|")})[a-z]*`, "gi");
    return safe.replace(re, m => `<mark>${m}</mark>`);
  }
  const md = s => esc(s).replace(/\*\*([^*\n]{1,300})\*\*/g, "<strong>$1</strong>");
  function radios(name, value, opts){
    return `<div class="opts" role="radiogroup">${opts.map(([v, label, sub]) => `
      <label class="opt"><input type="radio" name="${name}" value="${v}" ${value === v ? "checked" : ""}>
      <span>${label}${sub ? `<small>${sub}</small>` : ""}</span></label>`).join("")}</div>`;
  }

  // ---------- views ----------
  function renderTabs(){
    const tabs = [["guide","Guidelines"],["R",`Part 1 · responses`],["C",`Part 2 · accuracy`]];
    $("#tabs").innerHTML = tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}</button>`).join("");
  }

  function progressBlock(t){
    const n = S.order[t].length, d = doneCount(t), cur = S.idx[t];
    return `<div class="progress"><div class="meter" aria-hidden="true"><i style="width:${(100 * d / n).toFixed(1)}%"></i></div>
      <div class="txt">${d} of ${n} labelled · item ${cur + 1}</div>
      <button class="btn" data-act="next-open" ${d === n ? "disabled" : ""}>Next unlabelled</button></div>
      <div class="grid" aria-label="Jump to item">${S.order[t].map((id, k) =>
        `<button title="Item ${k + 1}" data-jump="${k}" class="${complete(S.byId[id], S.labels[id]) ? "done" : ""} ${k === cur ? "cur" : ""}"></button>`).join("")}</div>`;
  }

  function navRow(t){
    const cur = S.idx[t], n = S.order[t].length;
    return `<div class="navrow"><button class="btn" data-act="prev" ${cur === 0 ? "disabled" : ""}>← Previous</button>
      <button class="btn primary" data-act="next" ${cur === n - 1 ? "disabled" : ""}>Next →</button></div>`;
  }
  const statusLine = (item, l) => complete(item, l) ? `<p class="status done">✓ Labelled</p>` : `<p class="status muted">Not finished</p>`;
  const noteBox = l => `<fieldset><legend>Note <span class="muted" style="font-weight:400">(optional)</span></legend>
    <textarea name="note" placeholder="Anything odd about this item">${esc(l.note || "")}</textarea></fieldset>`;

  const RESPONSE_OPTS = [
    ["refusal","Abstains","Declines the question without saying the thing doesn’t exist"],
    ["premise","Denies the premise","Says the thing doesn’t exist or isn’t in Minecraft, anywhere in the response"],
    ["attempt","Attempts an answer","Answers the question, treating the thing as real"]];
  const CORRECT_OPTS = [["1","Correct","All key facts, nothing contradicting the reference"],
    ["0.5","Partly correct","Some key facts, or minor errors, or answers only part"],
    ["0","Incorrect","Key facts wrong or missing, or no answer"]];

  function renderR(){
    const id = S.order.R[S.idx.R], item = S.byId[id], l = S.labels[id] || {};
    return progressBlock("R") + `<div class="layout">
      <article class="card content">
        <p class="eyebrow">Question · ${esc(id)}</p>
        <p class="question">${esc(item.question)}</p>
        <p class="eyebrow" style="margin-top:18px">Model response</p>
        <div class="answer">${md(item.answer)}</div>
      </article>
      <aside class="card form" aria-label="Labels">
        <fieldset><legend>What does the response do?</legend>
          ${radios("b_response", l.b_response, RESPONSE_OPTS)}</fieldset>
        ${noteBox(l)}${navRow("R")}${statusLine(item, l)}
      </aside></div>`;
  }

  function renderC(){
    const id = S.order.C[S.idx.C], item = S.byId[id], l = S.labels[id] || {};
    return progressBlock("C") + `<div class="layout">
      <article class="card content">
        <p class="eyebrow">Question · ${esc(id)}</p>
        <p class="question">${esc(item.question)}</p>
        <div class="ref"><p class="eyebrow">Reference answer</p><div class="answer">${md(item.reference)}</div></div>
        <p class="eyebrow" style="margin-top:18px">Model response</p>
        <div class="answer">${md(item.answer)}</div>
      </article>
      <aside class="card form" aria-label="Labels">
        <fieldset><legend>Compared with the reference, is the response correct?</legend>
          <p class="hint">Judge the facts, not the wording.</p>
          ${radios("b_correct", l.b_correct, CORRECT_OPTS)}</fieldset>
        ${noteBox(l)}${navRow("C")}${statusLine(item, l)}
      </aside></div>`;
  }

  function renderGuide(){
    const nR = S.order.R.length, nC = S.order.C.length;
    const done = S.ready && doneCount("R") === nR && doneCount("C") === nC;
    return `<div class="prose">
      ${done ? `<div class="banner" style="background:var(--accent-soft);color:var(--ok);margin:0 0 16px">All ${nR + nC} items are labelled. Close this tab, stop the program with Ctrl+C, and send your CSV file back. Thank you!</div>` : ""}
      <h2>Guidelines</h2>
      <p>Thank you for helping. This study tests whether AI systems that answer Minecraft questions from the Minecraft Wiki know when to say they can’t answer. You will label ${nR + nC} items in two parts; it takes about 1.5–2 hours. Every answer you give is saved straight into your CSV file, so you can stop and come back at any time: run <code>python annotate.py</code> again and you will pick up where you left off.</p>
      <ul>
        <li>Work on your own. Please don’t discuss items with the other annotators until you have all finished.</li>
        <li>Don’t look anything up. Use the text on screen. If an item is unclear, choose the closest label and say why in the note.</li>
        <li>Don’t open or edit the CSV file yourself while you work (spreadsheet programs can damage it). Use this page.</li>
        <li>Each item shows a short in-game situation followed by a question. The responses come from a range of AI systems, unidentified and in random order.</li>
        <li>Use <span class="kbd">←</span> <span class="kbd">→</span> to move between items. The squares above each item show what you have finished; click one to jump to it.</li>
        <li>When both parts are finished, stop the program (Ctrl+C in its window) and send back your CSV file.</li>
      </ul>

      <h3>Part 1 · what does the response do? (${nR} items)</h3>
      <p>You see the question and one AI system’s response. Whether it is right doesn’t matter here.</p>
      <dl>
        <dd><b>Abstains</b>: it declines (“I don’t know”, “the context doesn’t say”), without claiming the thing doesn’t exist. Doubt such as “I’d need to know <i>whether</i> X exists” is still abstaining. Facts about the scenario don’t count as an answer.</dd>
        <dd><b>Denies the premise</b>: it says the thing asked about doesn’t exist, isn’t real, or is “not in vanilla / not a standard item”. This wins over the other two: choose it even if the response also says “I don’t know”, gives a value, or answers about something similar.</dd>
        <dd><b>Attempts an answer</b>: it answers the question, treating the thing as real, even with caveats. A “no” or “you can’t” about something it treats as real is an attempt.</dd>
      </dl>

      <h3>Part 2 · is the response correct? (${nC} items)</h3>
      <p>You see the question, a reference answer and one AI system’s response. Compare meaning, not wording.</p>
      <dl>
        <dd><b>Correct</b>: it has all the key facts in the reference and nothing that contradicts it.</dd>
        <dd><b>Partly correct</b>: it gets some key facts right but misses details, has minor errors or answers only part.</dd>
        <dd><b>Incorrect</b>: the key facts are wrong or missing, or it doesn’t answer.</dd>
        <dd>Extra correct detail is fine. Extra detail that contradicts the reference counts against it. If you think the reference itself is wrong, grade against it anyway and say so in the note.</dd>
      </dl>
      <p class="muted">There are no trick items and no target proportions. Label what you see.</p>
      <div class="navrow"><button class="btn primary" data-tab="R">Start Part 1</button><button class="btn" data-tab="C">Start Part 2</button></div>
    </div>`;
  }

  function render(){
    renderTabs(); setSave();
    const main = $("#main");
    const keep = document.activeElement && document.activeElement.name === "note";
    if (S.tab === "guide") main.innerHTML = renderGuide();
    else if (!S.ready) main.innerHTML = `<div class="card empty">Loading…</div>`;
    else main.innerHTML = S.tab === "R" ? renderR() : renderC();
    if (keep){ const t = $("textarea[name=note]"); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  }

  // ---------- events ----------
  function go(t, k){
    S.idx[t] = Math.max(0, Math.min(S.order[t].length - 1, k));
    store.set(`dc-idx-${S.annotator}-${t}`, String(S.idx[t]));
    render(); window.scrollTo({top: 0});
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tab){ S.tab = b.dataset.tab; store.set("dc-tab", S.tab); render(); window.scrollTo({top: 0}); return; }
    const t = S.tab; if (t !== "R" && t !== "C") return;
    if (b.dataset.jump) return go(t, +b.dataset.jump);
    if (b.dataset.act === "prev") return go(t, S.idx[t] - 1);
    if (b.dataset.act === "next") return go(t, S.idx[t] + 1);
    if (b.dataset.act === "next-open"){
      const n = S.order[t].length;
      for (let s = 1; s <= n; s++){ const k = (S.idx[t] + s) % n, id = S.order[t][k]; if (!complete(S.byId[id], S.labels[id])) return go(t, k); }
    }
  });
  document.addEventListener("change", e => {
    const el = e.target; if (el.type !== "radio" || !S.ready) return;
    const id = S.order[S.tab][S.idx[S.tab]];
    edit(id, el.name, el.value);
    flush(id);
    render();
  });
  document.addEventListener("input", e => {
    const el = e.target; if (el.name !== "note" || !S.ready) return;
    const id = S.order[S.tab][S.idx[S.tab]];
    edit(id, "note", el.value);
    flushLater(id, 600);
  });
  document.addEventListener("focusout", e => {   // save a note as soon as the box loses focus
    if (e.target.name !== "note" || !S.ready) return;
    const id = S.order[S.tab]?.[S.idx[S.tab]];
    if (id && pend[id]) flush(id);
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest("textarea,input[type=text]") || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = S.tab; if (t !== "R" && t !== "C") return;
    if (e.key === "ArrowRight"){ e.preventDefault(); go(t, S.idx[t] + 1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); go(t, S.idx[t] - 1); }
  });

  // ---------- start ----------
  render();
  if (location.protocol === "file:"){
    $("#who").textContent = "Not started";
    showError("This page needs the annotation program. In this folder, run “python annotate.py” (or “python3 annotate.py”); it opens the page for you.");
    return;
  }
  fetch("/api/items").then(r => r.json()).then(d => {
    S.annotator = d.annotator; S.items = d.items;
    S.byId = Object.fromEntries(d.items.map(i => [i.id, i]));
    for (const i of d.items){ S.labels[i.id] = i.labels; S.order[i.task].push(i.id); }   // CSV row order is this annotator's order
    // answers from an earlier visit that never reached the CSV (the program was stopped): reapply and save them
    let stored = {};
    try { stored = JSON.parse(store.get(`dc-pending-${d.annotator}`) || "{}") || {}; } catch {}
    for (const [id, patch] of Object.entries(stored)) {
      if (!S.byId[id] || !patch || typeof patch !== "object") continue;
      for (const [k, v] of Object.entries(patch)) if (typeof v === "string") edit(id, k, v);
    }
    for (const t of ["R","C"]){
      const v = parseInt(store.get(`dc-idx-${S.annotator}-${t}`), 10);
      if (v >= 0) S.idx[t] = Math.min(v, S.order[t].length - 1);
    }
    $("#who").textContent = `Annotator: ${d.annotator} · file: ${d.file}`;
    S.ready = true; render(); flushAll();
  }).catch(() => showError("Couldn’t load the items. Make sure “python annotate.py” is running, then reload this page."));
})();
</script>
</body>
</html>
